<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log to Lumber — Multi-Log Cuts</title>
<meta name="description" content="Multiple logs showing different milling strategies. Some cuts prevent others.">
<meta property="og:title" content="Log to Lumber — Multi-Log Cuts">
<meta property="og:description" content="See why certain milling cuts lock out other options.">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<style>
  html,body{margin:0;height:100%;background:#1a1e2e;color:#EAEDF6;font-family:system-ui,sans-serif;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:0;left:0;right:0;padding:10px 16px;background:#1a1e2e;border-bottom:1px solid #3a4060;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .brand{font-weight:700;color:#FFB547;}
  .tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
  button.chip,a.chip{background:rgba(255,255,255,.08);border:1px solid #3a4060;border-radius:999px;padding:5px 10px;text-decoration:none;color:inherit;font-size:12px;cursor:pointer;}
  button.chip.on{background:#FFB547;color:#241500;}
  .card{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:#252a3d;border:1px solid #3a4060;border-radius:12px;padding:14px;z-index:10;}
  .prompt{font-size:18px;font-weight:700;margin:0 0 4px;}
  .sub{color:#b0b8d0;font-size:13px;margin-bottom:8px;}
  .cuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .sponsor{margin-top:8px;padding-top:8px;border-top:1px solid #3a4060;font-size:12px;color:#9AA2BF;}
  .sponsor a{color:#FFB547;text-decoration:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud"><div class="brand">LOG TO LUMBER</div><div class="tools"><a class="chip" href="../index.html">Library</a></div></header>
<section class="card">
  <div class="prompt" id="prompt">Three Logs — Different Strategies</div>
  <div class="sub" id="sub">Left: Live edge · Center: Cant + dimension · Right: Quarter / radial</div>
  <div class="cuts">
    <button class="chip on" data-view="all">All Strategies</button>
    <button class="chip" data-view="live">Live Edge Only</button>
    <button class="chip" data-view="cant">Cant Path</button>
    <button class="chip" data-view="quarter">Quarter Path</button>
  </div>
  <div class="sponsor">Demo · <a href="https://www.amazon.com/s?k=portable+sawmill" target="_blank" rel="noopener">Portable Sawmills</a> · <a href="https://www.amazon.com/s?k=wood+mill+blade" target="_blank" rel="noopener">Mill Blades</a></div>
</section>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const canvas=document.getElementById("c");
const prompt=document.getElementById("prompt");
const sub=document.getElementById("sub");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a3048);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const key=new THREE.DirectionalLight(0xffffff,1.3);key.position.set(5,10,7);scene.add(key);
const fill=new THREE.DirectionalLight(0xaaccff,0.35);fill.position.set(-5,3,-4);scene.add(fill);
const group=new THREE.Group();scene.add(group);
const wood=new THREE.MeshStandardMaterial({color:0x8B5A2B,roughness:0.8});
const end=new THREE.MeshStandardMaterial({color:0xA67C52,roughness:0.85});
const bark=new THREE.MeshStandardMaterial({color:0x4A3728,roughness:0.95});
const cut=new THREE.MeshStandardMaterial({color:0xC4A574,roughness:0.65});
let meshes=[];
function clear(){meshes.forEach(m=>group.remove(m));meshes=[];}
function add(geo,mat,pos,rot=[0,0,0]){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.rotation.set(...rot);group.add(m);meshes.push(m);return m;}
function makeLog(x){
  add(new THREE.CylinderGeometry(1.05,1.05,5.5,36),wood,[x,0,0],[0,0,Math.PI/2]);
  add(new THREE.CircleGeometry(1.05,36),end,[x+2.75,0,0],[0,Math.PI/2,0]);
  add(new THREE.CircleGeometry(1.05,36),end,[x-2.75,0,0],[0,-Math.PI/2,0]);
}
function liveEdge(x){
  add(new THREE.BoxGeometry(5.2,0.38,2.15),wood,[x,0.3,0]);
  add(new THREE.BoxGeometry(5.2,0.38,0.18),bark,[x,0.3,1.1]);
  add(new THREE.BoxGeometry(5.2,0.38,0.18),bark,[x,0.3,-1.1]);
  add(new THREE.BoxGeometry(5.2,0.32,1.9),wood,[x,-0.35,0]);
}
function cantPath(x){
  add(new THREE.BoxGeometry(5.0,1.4,1.6),wood,[x,0,0]);
  add(new THREE.BoxGeometry(5.0,0.28,1.6),cut,[x,0.84,0]);
  add(new THREE.BoxGeometry(5.0,0.28,1.6),cut,[x,-0.84,0]);
  add(new THREE.BoxGeometry(4.6,0.2,0.85),wood,[x,0.2,1.15]);
  add(new THREE.BoxGeometry(4.2,0.2,0.75),wood,[x,-0.15,1.15]);
}
function quarterPath(x){
  const q=new THREE.BoxGeometry(1.5,0.32,2.4);
  add(q,cut,[x-0.8,0.45,0]);
  add(q,cut,[x+0.8,0.45,0]);
  add(q,cut,[x-0.8,-0.45,0]);
  add(q,cut,[x+0.8,-0.45,0]);
  add(new THREE.BoxGeometry(0.3,1.6,2.4),wood,[x,0,0]);
}
function showAll(){
  clear();
  liveEdge(-4.2);
  cantPath(0);
  quarterPath(4.2);
  prompt.textContent="Three Logs — Different Strategies";
  sub.textContent="Left: Live edge · Center: Cant + dimension · Right: Quarter / radial";
}
function showLive(){clear();liveEdge(0);prompt.textContent="Live Edge Path";sub.textContent="Bark edges kept. Harder to get standard dimension boards from the same log.";}
function showCant(){clear();cantPath(0);prompt.textContent="Cant Path";sub.textContent="Squared center. Good for dimension lumber. Sacrifices live-edge slabs.";}
function showQuarter(){clear();quarterPath(0);prompt.textContent="Quarter / Radial Path";sub.textContent="Stable boards with radial grain. Lower yield. Different from plain sawing.";}
const views={all:showAll,live:showLive,cant:showCant,quarter:showQuarter};
document.querySelectorAll(".cuts button").forEach(btn=>{
  btn.onclick=()=>{document.querySelectorAll(".cuts button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");views[btn.dataset.view]();fit();};
});
function resize(){const w=canvas.clientWidth||innerWidth;const h=canvas.clientHeight||innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}addEventListener("resize",resize);resize();
function fit(){const b=new THREE.Box3().setFromObject(group);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3());const c=b.getCenter(new THREE.Vector3());const d=Math.max(s.x,s.y,s.z)/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.55;camera.position.copy(c).add(new THREE.Vector3(d*0.3,d*0.45,d));controls.target.copy(c);controls.update();}
showAll();fit();
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);}loop();
</script>
</body>
</html>
