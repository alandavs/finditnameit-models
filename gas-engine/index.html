<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find It Name It · Engine</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  html,body { margin:0; height:100%; background:#0A0D18; color:#EAEDF6; font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; top:0; left:0; right:0; padding:12px 16px; background:#0A0D18; border-bottom:1px solid #2B3354; z-index:10; display:flex; gap:12px; align-items:center; }
  .brand { font-weight:700; color:#FFB547; }
  .card { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:min(520px,92vw); background:#121628; border:1px solid #2B3354; border-radius:12px; padding:16px; z-index:10; }
  .prompt { font-size:20px; font-weight:700; margin:0 0 6px; }
  .sub { color:#9AA2BF; font-size:14px; }
  a.chip, button.chip { background:rgba(255,255,255,.06); border:1px solid #2B3354; border-radius:999px; padding:6px 12px; text-decoration:none; color:inherit; font-size:13px; cursor:pointer; }
  .tools { display:flex; gap:8px; margin-left:auto; }
  .credit { position:fixed; bottom:6px; right:10px; font-size:11px; color:#666; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud">
  <div class="brand">ENGINE</div>
  <div class="tools">
    <button class="chip" id="hide">Hide selected</button>
    <button class="chip" id="show">Show all</button>
    <a class="chip" href="../index.html">← Library</a>
  </div>
</header>
<section class="card">
  <div class="prompt" id="prompt">Loading real engine…</div>
  <div class="sub" id="sub">Fetching detailed model</div>
</section>
<div class="credit">Model: Engine-X by Parth Parmar (engx3d.com) · CC BY-NC 4.0</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const canvas = document.getElementById("c");
const prompt = document.getElementById("prompt");
const sub = document.getElementById("sub");
const hideBtn = document.getElementById("hide");
const showBtn = document.getElementById("show");
function setStatus(a, b) { prompt.textContent = a; if (b !== undefined) sub.textContent = b; }

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d18);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x6070a0, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(6, 10, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffb547, 0.3);
rim.position.set(-5, 3, -6);
scene.add(rim);

const group = new THREE.Group();
scene.add(group);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;
const partNames = new Map();
const meshesById = new Map();
let selectedId = null;
let selectedMesh = null;

function select(obj) {
  if (selectedMesh) selectedMesh.material = selectedMesh.userData.origMaterial || selectedMesh.material;
  selectedMesh = obj;
  selectedId = obj?.userData?.id || null;
  if (obj && obj.material) {
    obj.userData.origMaterial = obj.material;
    obj.material = obj.material.clone();
    obj.material.emissive = new THREE.Color(0x442200);
    obj.material.emissiveIntensity = 0.4;
  }
  const name = partNames.get(selectedId) || selectedId || "part";
  setStatus(name, "Click Hide selected or press H to hide it");
}

function hideSelected() {
  if (!selectedMesh) return;
  selectedMesh.visible = false;
  setStatus("Hidden: " + (partNames.get(selectedId) || selectedId), "Press Show all or R to restore");
  selectedMesh = null;
  selectedId = null;
}

function showAll() {
  group.traverse(c => {
    if (c.isMesh) c.visible = true;
  });
  setStatus("All parts shown", "Click any part to select it");
}

hideBtn.onclick = hideSelected;
showBtn.onclick = showAll;

addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") hideSelected();
  if (e.key === "r" || e.key === "R") showAll();
});

canvas.addEventListener("pointerdown", e => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 16) return;

  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(group.children, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.id) obj = obj.parent;
    if (obj) select(obj);
  } else {
    if (selectedMesh) selectedMesh.material = selectedMesh.userData.origMaterial || selectedMesh.material;
    selectedMesh = null;
    selectedId = null;
    setStatus("No hit", "Click on the engine.");
  }
});

function resize() {
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener("resize", resize);
resize();

function fit() {
  const box3 = new THREE.Box3().setFromObject(group);
  if (box3.isEmpty()) return;
  const size = box3.getSize(new THREE.Vector3());
  const center = box3.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.7;
  camera.position.copy(center).add(new THREE.Vector3(dist * 0.5, dist * 0.3, dist));
  controls.target.copy(center);
  controls.update();
}

setStatus("Loading real engine…", "Engine-X detailed model");

const loader = new GLTFLoader();
loader.load(
  "https://engx3d.com/models/carengine.glb",
  (gltf) => {
    const model = gltf.scene;
    model.scale.setScalar(1);
    model.position.set(0, 0, 0);

    let count = 0;
    model.traverse(c => {
      if (c.isMesh) {
        count++;
        const raw = (c.name || "part_" + count).replace(/[^a-zA-Z0-9_]/g, "_").toLowerCase();
        const id = raw || "mesh_" + count;
        c.userData.id = id;
        partNames.set(id, c.name || ("Part " + count));
        meshesById.set(id, c);
      }
    });

    group.add(model);
    fit();
    setStatus("Engine ready", count + " parts · click to select, then Hide or press H");
  },
  undefined,
  (err) => {
    console.error(err);
    setStatus("Load failed", "Could not fetch the GLB. Check console.");
  }
);

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
