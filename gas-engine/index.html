<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find It Name It · Gas Engine</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  html,body { margin:0; height:100%; background:#0A0D18; color:#EAEDF6; font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; top:0; left:0; right:0; padding:12px 16px; background:#0A0D18; border-bottom:1px solid #2B3354; z-index:10; display:flex; gap:12px; align-items:center; }
  .brand { font-weight:700; color:#FFB547; }
  .card { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:min(480px,90vw); background:#121628; border:1px solid #2B3354; border-radius:12px; padding:16px; z-index:10; }
  .prompt { font-size:20px; font-weight:700; margin:0 0 6px; }
  .sub { color:#9AA2BF; font-size:14px; }
  a.chip { background:rgba(255,255,255,.06); border:1px solid #2B3354; border-radius:999px; padding:6px 12px; text-decoration:none; color:inherit; font-size:13px; margin-left:auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud">
  <div class="brand">GAS ENGINE · CLICK TEST</div>
  <a class="chip" href="../index.html">← Library</a>
</header>
<section class="card">
  <div class="prompt" id="prompt">Loading…</div>
  <div class="sub" id="sub">If you can click the model, this line will change.</div>
</section>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const canvas = document.getElementById("c");
const prompt = document.getElementById("prompt");
const sub = document.getElementById("sub");

function setStatus(a, b) { prompt.textContent = a; if (b) sub.textContent = b; }

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d18);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x6070a0, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(5, 8, 6);
scene.add(key);

const group = new THREE.Group();
scene.add(group);

// Always-visible clickable fallback
const box = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 0.9, 0.9),
  new THREE.MeshStandardMaterial({ color: 0x5a6a8a, metalness: 0.5, roughness: 0.4 })
);
box.userData = { id: "engine", name: "Engine block" };
group.add(box);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let down = null;

canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if (moved > 8) return;

  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(group.children, true);
  if (hits.length) {
    const obj = hits[0].object;
    setStatus("Clicked!", obj.userData.name || "Engine part · " + (obj.userData.id || "unknown"));
  } else {
    setStatus("Missed", "Click landed on empty space");
  }
});

function resize() {
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener("resize", resize);
resize();

const box3 = new THREE.Box3().setFromObject(group);
const size = box3.getSize(new THREE.Vector3());
const center = box3.getCenter(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
const dist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 2;
camera.position.copy(center).add(new THREE.Vector3(dist * 0.6, dist * 0.4, dist));
controls.target.copy(center);
controls.update();

setStatus("Tap the box", "A short click (not a drag) should change this text.");

// Try the real GLB in the background
const loader = new GLTFLoader();
loader.load(
  "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/2CylinderEngine/glTF-Binary/2CylinderEngine.glb",
  (gltf) => {
    const model = gltf.scene;
    model.scale.setScalar(0.008);
    model.position.y = -0.4;
    model.traverse(c => {
      if (c.isMesh) c.userData = { id: "engine", name: "Engine assembly" };
    });
    group.remove(box);
    group.add(model);
    const b = new THREE.Box3().setFromObject(model);
    const c = b.getCenter(new THREE.Vector3());
    const s = b.getSize(new THREE.Vector3());
    const d = Math.max(s.x, s.y, s.z) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.8;
    camera.position.copy(c).add(new THREE.Vector3(d * 0.5, d * 0.3, d));
    controls.target.copy(c);
    controls.update();
    setStatus("Real engine loaded", "Tap anywhere on it.");
  },
  undefined,
  () => setStatus("Using simple model", "GLB failed — box is still clickable.")
);

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
