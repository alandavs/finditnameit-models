<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find It Name It · Gas Engine</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  html,body { margin:0; height:100%; background:#0A0D18; color:#EAEDF6; font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; top:0; left:0; right:0; padding:12px 16px; background:#0A0D18; border-bottom:1px solid #2B3354; z-index:10; display:flex; gap:12px; align-items:center; }
  .brand { font-weight:700; color:#FFB547; }
  .card { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:min(520px,92vw); background:#121628; border:1px solid #2B3354; border-radius:12px; padding:16px; z-index:10; }
  .prompt { font-size:20px; font-weight:700; margin:0 0 6px; }
  .sub { color:#9AA2BF; font-size:14px; }
  a.chip { background:rgba(255,255,255,.06); border:1px solid #2B3354; border-radius:999px; padding:6px 12px; text-decoration:none; color:inherit; font-size:13px; margin-left:auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud">
  <div class="brand">GAS ENGINE</div>
  <a class="chip" href="../index.html">← Library</a>
</header>
<section class="card">
  <div class="prompt" id="prompt">Loading engine…</div>
  <div class="sub" id="sub">Click any part to identify it.</div>
</section>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const canvas = document.getElementById("c");
const prompt = document.getElementById("prompt");
const sub = document.getElementById("sub");
function setStatus(a, b) { prompt.textContent = a; if (b !== undefined) sub.textContent = b; }

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d18);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x6070a0, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(6, 10, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffb547, 0.35);
rim.position.set(-5, 3, -6);
scene.add(rim);

const group = new THREE.Group();
scene.add(group);

// Materials
const matBlock = new THREE.MeshStandardMaterial({ color: 0x3a3a42, metalness: 0.6, roughness: 0.4 });
const matAlum = new THREE.MeshStandardMaterial({ color: 0xc8d0d8, metalness: 0.85, roughness: 0.2 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x9aa0aa, metalness: 0.9, roughness: 0.22 });
const matPiston = new THREE.MeshStandardMaterial({ color: 0xd4b84a, metalness: 0.4, roughness: 0.45 });
const matRed = new THREE.MeshStandardMaterial({ color: 0xb33a3a, metalness: 0.3, roughness: 0.5 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x1c1c22, metalness: 0.5, roughness: 0.55 });
const matIntake = new THREE.MeshStandardMaterial({ color: 0x4a6a8a, metalness: 0.4, roughness: 0.4 });
const matExhaust = new THREE.MeshStandardMaterial({ color: 0x6a4a3a, metalness: 0.45, roughness: 0.42 });
const matValve = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.7, roughness: 0.25 });

const parts = {
  block: { name: "Engine block", fact: "Main casting that holds the cylinders, crankshaft bearings and coolant jackets." },
  cylinders: { name: "Cylinders", fact: "Precision bores the pistons slide in. Combustion happens above each piston." },
  pistons: { name: "Pistons", fact: "Transfer combustion force downward. Have ring grooves for sealing." },
  rods: { name: "Connecting rods", fact: "Convert the piston’s linear motion into rotation of the crankshaft." },
  crankshaft: { name: "Crankshaft", fact: "Turns reciprocating motion into rotational power. Counterweights balance the throws." },
  sparkplugs: { name: "Spark plugs", fact: "Ignite the compressed air-fuel mixture with a timed spark." },
  valves: { name: "Valves", fact: "Open and close the intake and exhaust ports. Typically 2 or 4 per cylinder." },
  camshaft: { name: "Camshaft", fact: "Times valve opening. Driven at half crank speed." },
  valvecover: { name: "Valve cover", fact: "Covers the valvetrain. Can be removed for inspection." },
  intake: { name: "Intake manifold", fact: "Distributes the air-fuel mixture to each cylinder." },
  exhaust: { name: "Exhaust manifold", fact: "Collects exhaust gases from the cylinders." },
  oilpan: { name: "Oil pan", fact: "Reservoir for engine oil. The pickup tube draws from it." }
};

function add(mesh, id) {
  mesh.userData.id = id;
  mesh.userData.name = parts[id].name;
  group.add(mesh);
}

// Block
const block = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.6, 1.7), matBlock);
block.position.y = 0.1;
add(block, "block");

// Cylinder head
const head = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.65, 1.8), matAlum);
head.position.y = 1.45;
add(head, "block");

// Four cylinders + pistons + rods + valves + plugs
for (let i = 0; i < 4; i++) {
  const x = (i - 1.5) * 0.95;

  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 32), matSteel);
  cyl.position.set(x, 0.85, 0);
  add(cyl, "cylinders");

  const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.32, 24), matPiston);
  piston.position.set(x, 1.15 + (i % 2) * 0.12, 0);
  add(piston, "pistons");

  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.9, 12), matSteel);
  rod.position.set(x, 0.35, 0);
  add(rod, "rods");

  const plug = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.4, 10), matRed);
  plug.position.set(x, 2.05, 0.2);
  add(plug, "sparkplugs");

  for (let v = 0; v < 2; v++) {
    const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.45, 8), matValve);
    valve.position.set(x + (v - 0.5) * 0.2, 1.85, -0.12);
    add(valve, "valves");
  }
}

// Crankshaft
const crank = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 4.6, 20), matSteel);
crank.rotation.z = Math.PI / 2;
crank.position.set(0, -0.55, 0);
add(crank, "crankshaft");

// Camshaft
const cam = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 4.2, 16), matAlum);
cam.rotation.z = Math.PI / 2;
cam.position.set(0, 1.95, -0.3);
add(cam, "camshaft");

// Valve cover
const cover = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.3, 1.9), matAlum);
cover.position.y = 2.35;
add(cover, "valvecover");

// Intake manifold
const intake = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.3, 0.35), matIntake);
intake.position.set(0, 1.6, 0.95);
add(intake, "intake");

// Exhaust manifold
const exhaust = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.28, 0.32), matExhaust);
exhaust.position.set(0, 1.55, -0.95);
add(exhaust, "exhaust");

// Oil pan
const pan = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.4, 1.5), matDark);
pan.position.y = -1.15;
add(pan, "oilpan");

// Raycasting
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;

canvas.addEventListener("pointerdown", e => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 18) return;

  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(group.children, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.id) obj = obj.parent;
    const id = obj?.userData?.id;
    if (id && parts[id]) {
      setStatus(parts[id].name, parts[id].fact);
    }
  } else {
    setStatus("No hit", "Click on a part of the engine.");
  }
});

function resize() {
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener("resize", resize);
resize();

function fit() {
  const box3 = new THREE.Box3().setFromObject(group);
  const size = box3.getSize(new THREE.Vector3());
  const center = box3.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.7;
  camera.position.copy(center).add(new THREE.Vector3(dist * 0.5, dist * 0.3, dist));
  controls.target.copy(center);
  controls.update();
}
fit();

setStatus("Engine ready", "Click any part — block, pistons, valves, crankshaft, etc.");

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
