<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find It Name It · Gas Engine</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root { --ink:#0A0D18; --panel:#121628; --line:#2B3354; --text:#EAEDF6; --amber:#FFB547; --good:#4ADE9A; --bad:#FF6B6B; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; top:0; left:0; right:0; padding:10px 16px; background:var(--ink); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; z-index:5; }
  .brand { font-weight:700; color:var(--amber); letter-spacing:.05em; }
  .chip { background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .chip[aria-pressed="true"] { background:var(--amber); color:#241500; }
  .card { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); width:min(520px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; z-index:5; }
  .prompt { font-size:22px; font-weight:700; margin:4px 0; }
  .sub { color:#9AA2BF; font-size:14px; min-height:1.4em; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  button.btn { background:transparent; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.btn.primary { background:var(--amber); color:#241500; border-color:var(--amber); }
  input { background:var(--ink); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; width:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud">
  <div class="brand">FIND IT NAME IT · GAS ENGINE</div>
  <div id="styles"></div>
  <div id="modes"></div>
  <button class="chip" id="layers">Toggle layers (L)</button>
</header>
<section class="card" id="card">
  <div class="prompt" id="prompt">Loading…</div>
  <div class="sub" id="sub"></div>
  <div id="input-area" hidden><input id="name-input" placeholder="Type the name…" autocomplete="off"></div>
  <div class="actions" id="actions"></div>
</section>

<script type="module">
import { Viewer } from "../shared/viewer.js";
import { Quiz, MODES, STYLES } from "../engine/quiz.js";
import { items, build } from "./model.js";

const canvas = document.getElementById("c");
const viewer = new Viewer(canvas);
const engineGroup = build(viewer.scene);
viewer.fit(engineGroup);

const pickables = [];
engineGroup.traverse(o => { if (o.userData.id) pickables.push(o); });
viewer.setPickables(pickables);

const quiz = new Quiz(items, { statsKey: "fini-gas-engine" });

function render() {
  const style = quiz.style, mode = quiz.mode;
  document.getElementById("styles").innerHTML = Object.entries(STYLES).map(([k,v]) =>
    `<button class="chip" data-s="${k}" aria-pressed="${k===style}">${v}</button>`).join("");
  document.getElementById("modes").innerHTML = Object.entries(MODES).map(([k,v]) =>
    `<button class="chip" data-m="${k}" aria-pressed="${k===mode}">${v}</button>`).join("");

  const prompt = document.getElementById("prompt");
  const sub = document.getElementById("sub");
  const actions = document.getElementById("actions");
  const inputArea = document.getElementById("input-area");
  actions.innerHTML = "";
  inputArea.hidden = true;

  if (style === "explore") {
    prompt.textContent = "Tap any part to learn about it";
    sub.textContent = "CAD controls: left-drag spin, right-drag pan, scroll zoom, F to fit, L to toggle outer layers";
  } else if (style === "find") {
    const t = quiz.target;
    if (t) {
      prompt.innerHTML = `Find the <em>${quiz.byId[t].name}</em>`;
      sub.textContent = quiz.byId[t].hint || "";
    } else {
      prompt.textContent = "All found!";
      sub.textContent = "";
    }
    if (!quiz.exam) actions.innerHTML = `<button class="btn" id="reveal">Reveal</button><button class="btn" id="skip">Skip</button>`;
  } else if (style === "name") {
    prompt.textContent = quiz.selected ? `Name this: ${quiz.byId[quiz.selected].name}` : "Tap a part, then type its name";
    inputArea.hidden = !quiz.selected;
    if (quiz.selected && !quiz.exam) actions.innerHTML = `<button class="btn" id="reveal">Reveal</button>`;
  }

  if (quiz.exam && !quiz.graded) actions.innerHTML += `<button class="btn primary" id="grade">Grade me</button>`;
}

function bind() {
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { quiz.start(quiz.mode, b.dataset.s); render(); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { quiz.start(b.dataset.m, quiz.style); render(); });
  document.getElementById("layers").onclick = () => viewer.toggleLayers();
  document.getElementById("reveal")?.addEventListener("click", () => { quiz.reveal(); render(); });
  document.getElementById("skip")?.addEventListener("click", () => { quiz.skip(); render(); });
  document.getElementById("grade")?.addEventListener("click", () => { quiz.grade(); quiz.record(); render(); });
  document.getElementById("name-input")?.addEventListener("keydown", e => {
    if (e.key === "Enter") { quiz.answerName(e.target.value); e.target.value = ""; render(); }
  });
}

viewer.onPick = (id) => {
  const res = quiz.pick(id);
  if (res.ok) document.getElementById("sub").textContent = "Correct!";
  else if (res.ok === false) document.getElementById("sub").textContent = "Try again";
  render();
};

try {
  render();
  bind();
  setInterval(() => { if (quiz.tick()) render(); }, 500);
} catch (e) {
  document.getElementById("prompt").textContent = "Error: " + e.message;
  console.error(e);
}
</script>
</body>
</html>
